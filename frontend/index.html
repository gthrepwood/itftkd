<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITF Taekwondo Kvíz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .option-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .option-btn.correct {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.5);
        }
        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }
        .progress-fill {
            transition: width 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        .speak-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .speak-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .speak-btn:active {
            transform: scale(0.95);
        }
        .speak-btn.speaking {
            background: rgba(34, 197, 94, 0.3);
            border-color: rgba(34, 197, 94, 0.6);
        }
    </style>
</head>
<body class="text-white">
    <div id="app" class="min-h-screen flex items-center justify-center p-4">
        
        <div id="welcome-screen" class="text-center fade-in">
            <div class="glass rounded-2xl p-8 md:p-12 max-w-lg w-full shadow-2xl">
                <div class="mb-6">
                    <div class="text-6xl mb-4">🥋</div>
                    <h1 class="text-4xl md:text-5xl font-bold mb-4 bg-gradient-to-r from-yellow-400 to-red-500 bg-clip-text text-transparent">
                        ITF Taekwondo
                    </h1>
                    <p class="text-gray-300 text-lg mb-8">
                        Teszteld az ITF Taekwondo tudásod interaktív kvízekkel. Ismerd meg a formagyakorlatokat, koreai kifejezéseket és eredetüket.
                    </p>
                </div>
                
                <div class="space-y-4 mb-6">
                    <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                        <span class="text-gray-300">Téma</span>
                        <select id="topic-select" class="bg-white/10 rounded-lg px-4 py-2 text-white border border-white/20 focus:outline-none focus:border-yellow-400">
                            <option value="">Betöltés...</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center p-3 rounded-lg bg-white/5">
                        <span class="text-gray-300">Kérdések</span>
                        <select id="question-count" class="bg-white/10 rounded-lg px-4 py-2 text-white border border-white/20 focus:outline-none focus:border-yellow-400">
                            <option value="5">5 kérdés</option>
                            <option value="10" selected>10 kérdés</option>
                            <option value="15">15 kérdés</option>
                        </select>
                    </div>
                </div>

                <button onclick="startQuiz()" class="w-full bg-gradient-to-r from-yellow-500 to-red-600 hover:from-yellow-600 hover:to-red-700 text-white font-bold py-4 px-8 rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl text-lg pulse">
                    Indítás
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden w-full max-w-2xl">
            <div class="glass rounded-2xl p-6 md:p-8 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-2">
                        <span id="quiz-category" class="px-3 py-1 bg-yellow-500/20 text-yellow-400 rounded-full text-sm font-medium"></span>
                    </div>
                    <div class="text-right">
                        <span id="quiz-score" class="text-2xl font-bold text-yellow-400">0</span>
                        <span class="text-gray-400 text-sm"> pont</span>
                    </div>
                </div>

                <div class="w-full bg-gray-700/50 rounded-full h-2 mb-8">
                    <div id="progress-bar" class="progress-fill bg-gradient-to-r from-yellow-400 to-red-500 h-2 rounded-full" style="width: 0%"></div>
                </div>

                <div id="question-container" class="mb-8">
                    <h2 id="question-text" class="text-xl md:text-2xl font-semibold mb-8 text-center leading-relaxed"></h2>
                    
                    <div id="options-container" class="space-y-3">
                    </div>
                </div>

                <div id="feedback" class="hidden text-center">
                    <p id="feedback-text" class="text-lg font-medium mb-4"></p>
                    <button onclick="nextQuestion()" class="bg-gradient-to-r from-yellow-500 to-red-600 hover:from-yellow-600 hover:to-red-700 text-white font-bold py-3 px-8 rounded-xl transition-all duration-300">
                        Következő kérdés
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden text-center fade-in">
            <div class="glass rounded-2xl p-8 md:p-12 max-w-lg w-full shadow-2xl">
                <div class="mb-6">
                    <div id="result-emoji" class="text-6xl mb-4"></div>
                    <h2 class="text-3xl md:text-4xl font-bold mb-4">Kvíz véget ért!</h2>
                    <p id="result-message" class="text-gray-300 text-lg mb-8"></p>
                </div>
                
                <div class="glass rounded-xl p-6 mb-8">
                    <div class="text-5xl font-bold bg-gradient-to-r from-yellow-400 to-red-500 bg-clip-text text-transparent mb-2">
                        <span id="result-score">0</span>/<span id="result-total">0</span>
                    </div>
                    <p class="text-gray-400">Végeredmény</p>
                </div>

                <div class="space-y-3">
                    <button onclick="restartQuiz()" class="w-full bg-gradient-to-r from-yellow-500 to-red-600 hover:from-yellow-600 hover:to-red-700 text-white font-bold py-3 px-8 rounded-xl transition-all duration-300 transform hover:scale-105">
                        Újra
                    </button>
                    <button onclick="goHome()" class="w-full bg-white/10 hover:bg-white/20 text-white font-medium py-3 px-8 rounded-xl transition-all duration-300 border border-white/20">
                        Főoldal
                    </button>
                </div>
            </div>
        </div>

        <footer class="fixed bottom-2 left-0 right-0 text-center text-gray-500 text-xs">
            (C) 2026 Tamas Gervai
        </footer>
    </div>

    <script src="/assets/app.js"></script>
</body>
</html>
